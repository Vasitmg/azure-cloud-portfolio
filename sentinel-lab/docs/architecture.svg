<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Microsoft Sentinel detection lab – architecture</title>
  <desc id="d">Three data sources feed a Log Analytics workspace with Microsoft Sentinel. Four KQL analytics rules create incidents, and a Logic App playbook emails the analyst. Everything is deployed from GitHub with GitHub Actions using OIDC.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="690" rx="16" fill="#FFFFFF"/>

  <text x="40" y="44" font-size="20" font-weight="600" fill="#2C2C2A">Microsoft Sentinel detection lab</text>
  <text x="40" y="66" font-size="13" fill="#5F5E5A">Infrastructure and detections are defined as code in this repository and deployed by GitHub Actions</text>

  <!-- Data sources -->
  <g font-size="14" text-anchor="middle">
    <rect x="60" y="88" width="260" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="190" y="115" font-weight="600" fill="#085041">Azure Activity Log</text>
    <text x="190" y="136" font-size="12" fill="#0F6E56">Subscription diagnostic setting</text>

    <rect x="370" y="88" width="260" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="500" y="115" font-weight="600" fill="#085041">Microsoft Entra ID audit logs</text>
    <text x="500" y="136" font-size="12" fill="#0F6E56">Tenant diagnostic setting</text>

    <rect x="680" y="88" width="260" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="810" y="115" font-weight="600" fill="#085041">Windows Security events</text>
    <text x="810" y="136" font-size="12" fill="#0F6E56">Test VM (Sweden Central) · AMA + DCR</text>
  </g>

  <!-- Resource group -->
  <rect x="40" y="186" width="920" height="340" rx="16" fill="#FAFAF8" stroke="#888780" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="345" y="212" font-size="13" font-weight="600" text-anchor="middle" fill="#444441">rg-sentinel-lab · Germany West Central</text>

  <line x1="190" y1="154" x2="190" y2="226" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="500" y1="154" x2="500" y2="226" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="810" y1="154" x2="810" y2="226" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Workspace -->
  <rect x="70" y="228" width="860" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="500" y="254" font-size="15" font-weight="600" text-anchor="middle" fill="#085041">Log Analytics workspace · log-sentinel-lab</text>
  <text x="500" y="274" font-size="12" text-anchor="middle" fill="#0F6E56">90-day retention · 1 GB/day ingestion cap</text>

  <line x1="500" y1="288" x2="500" y2="306" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Sentinel -->
  <rect x="70" y="308" width="860" height="200" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="90" y="333" font-size="15" font-weight="600" fill="#3C3489">Microsoft Sentinel</text>

  <rect x="95" y="350" width="270" height="136" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
  <text x="115" y="375" font-size="14" font-weight="600" fill="#26215C">Analytics rules (KQL)</text>
  <g font-size="12" fill="#3C3489">
    <text x="115" y="399">T1098 · Azure RBAC role assignment</text>
    <text x="115" y="419">T1098.003 · Entra ID directory role</text>
    <text x="115" y="439">T1562 · Logging / detection tampering</text>
    <text x="115" y="459">T1110 · Burst of failed logons</text>
  </g>

  <rect x="400" y="350" width="190" height="136" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
  <text x="495" y="400" font-size="14" font-weight="600" text-anchor="middle" fill="#26215C">Incidents</text>
  <text x="495" y="422" font-size="12" text-anchor="middle" fill="#3C3489">Alerts grouped into cases</text>
  <text x="495" y="440" font-size="12" text-anchor="middle" fill="#3C3489">Account, IP, host entities</text>

  <rect x="625" y="350" width="280" height="136" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
  <text x="765" y="400" font-size="14" font-weight="600" text-anchor="middle" fill="#26215C">Playbook (Logic App)</text>
  <text x="765" y="422" font-size="12" text-anchor="middle" fill="#3C3489">pb-incident-email</text>
  <text x="765" y="440" font-size="12" text-anchor="middle" fill="#3C3489">Automation rule: on incident created</text>

  <line x1="365" y1="418" x2="398" y2="418" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="590" y1="418" x2="623" y2="418" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Email -->
  <line x1="765" y1="486" x2="765" y2="566" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="650" y="568" width="230" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="765" y="592" font-size="14" font-weight="600" text-anchor="middle" fill="#2C2C2A">Email to analyst</text>
  <text x="765" y="611" font-size="12" text-anchor="middle" fill="#5F5E5A">Severity, title, incident link</text>

  <!-- Delivery -->
  <rect x="60" y="568" width="240" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="180" y="592" font-size="14" font-weight="600" text-anchor="middle" fill="#2C2C2A">GitHub repository</text>
  <text x="180" y="611" font-size="12" text-anchor="middle" fill="#5F5E5A">Bicep · KQL · scripts</text>

  <line x1="300" y1="596" x2="338" y2="596" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="340" y="568" width="270" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="475" y="592" font-size="14" font-weight="600" text-anchor="middle" fill="#2C2C2A">GitHub Actions</text>
  <text x="475" y="611" font-size="12" text-anchor="middle" fill="#5F5E5A">OIDC, no secrets · lint → what-if → deploy</text>

  <line x1="475" y1="568" x2="475" y2="528" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Legend -->
  <g font-size="12" fill="#5F5E5A">
    <rect x="60" y="652" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="82" y="664">Data collection</text>
    <rect x="200" y="652" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="222" y="664">Detection and response</text>
    <rect x="380" y="652" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
    <text x="402" y="664">Delivery and notification</text>
  </g>
</svg>
